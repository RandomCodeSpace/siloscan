[package]
name = "siloscan-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Core library for siloscan: rule loading, scanning engines, findings"
# The detection corpus is credential-shaped by construction. It belongs in the
# repository, where the harness reads it, and nowhere near a published artifact.
# The profile corpus is not credential-shaped, but it is measurement input for a
# test that only ever runs from a checkout, so it is no more publishable than
# the other one.
exclude = ["tests/corpus/**", "tests/profiles-corpus/**"]

[dependencies]
getrandom = "0.4.3"
globset = "0.4.19"
ignore = "0.4.32"
regex = "1.13.1"
regex-syntax = "0.8.11"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
thiserror = "2.0.19"
toml = "1.1.4"
tree-sitter = "0.26.11"
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["lang-all"]
lang-all = [
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-ruby",
]
tree-sitter-rust = ["dep:tree-sitter-rust"]
tree-sitter-python = ["dep:tree-sitter-python"]
tree-sitter-javascript = ["dep:tree-sitter-javascript"]
tree-sitter-typescript = ["dep:tree-sitter-typescript"]
tree-sitter-go = ["dep:tree-sitter-go"]
tree-sitter-java = ["dep:tree-sitter-java"]
tree-sitter-c = ["dep:tree-sitter-c"]
tree-sitter-cpp = ["dep:tree-sitter-cpp"]
tree-sitter-c-sharp = ["dep:tree-sitter-c-sharp"]
tree-sitter-ruby = ["dep:tree-sitter-ruby"]
