      - "com.example.dsn=postgres://user:password@localhost:5432/db"
      - "com.example.cache=redis://:${REDIS_PASSWORD}@redis:6379/0"
  worker:
    image: registry.internal/worker:1.14.3
    environment:
      DATABASE_URL: "postgres://appuser:changeme@localhost:5432/app"
      BROKER_URL: "amqp://guest:guest@rabbitmq:5672"
      CACHE_URL: "redis://redis:6379/0"
      METRICS_URL: "https://metrics.internal/api/v1/write"
      MAIL_URL: "smtp://mailer@smtp.internal:587"
      VAULT_URL: "https://user:$VAULT_PASS@vault.internal"
      TENANT_URL: "https://user:{{ tenant_password }}@tenant.internal"
      DOCS_URL: "postgres://user:your-db-password-here@host:5432/db"
