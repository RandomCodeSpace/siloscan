# Java maintainability profile. Original work: the four measures are the
# engine's own (crates/siloscan-core/src/engines/metric.rs) and the thresholds
# are this repository's, chosen conservatively so the first run of a real tree
# stays readable.
#
# Identity: maintainability-java@1. See crates/siloscan-core/src/profiles.rs.
#
# The two query rules below come from the Java pitfall list (#109) and were
# measured on gson, commons-lang and guava under #103. One candidate from that
# list is deliberately absent, removed on the measurement rather than re-tuned:
#   catch-rethrow            within the `info` ceiling at 0.0117 per kLOC on
#                            guava, but all six findings are the selective
#                            rethrow `catch (ThreadDeath d) { throw d; }` placed
#                            above a broader catch so the narrow type is not
#                            swallowed, which is deliberate. TP:FP is 0:6.
# reliability-java.yaml records the other three.
#
# The two maintainability rows that list dispositioned "needs primitive" stayed
# out even with the #114 predicates in hand. reliability-java.yaml carries the
# one row from the same set that came in:
#   switch-without-default   inside the `info` ceiling at 0.1338 per kLOC on
#                            gson, but all five findings are the exhaustive
#                            switch over an enum, three of them followed by a
#                            throw for the value that cannot occur, so a
#                            `default` would be dead code. TP:FP is 0:5, and the
#                            class is an idiom rather than a path, so no
#                            exclusion reaches it.
#   parameter-reassigned     not expressible. The rule compares the assignment's
#                            target with the parameter name, and a
#                            `#has-descendant?` sub-pattern's captures are
#                            private to it: the sub-pattern is compiled as a
#                            query of its own, so naming the outer capture in
#                            its `#eq?` is a load error, `Invalid capture name`.
#                            Without the comparison the rule reports every
#                            assignment to a local under any method.
version: 1
rules:
  - id: maintainability.java.function-length
    severity: info
    message: 'This method is longer than the profile allows.'
    languages: [java]
    metric:
      measure: function-length
      max: 120

  - id: maintainability.java.parameter-count
    severity: info
    message: 'This method takes more parameters than the profile allows.'
    languages: [java]
    metric:
      measure: parameter-count
      max: 7

  - id: maintainability.java.nesting-depth
    severity: info
    message: 'This method nests more deeply than the profile allows.'
    languages: [java]
    metric:
      measure: nesting-depth
      max: 5

  - id: maintainability.java.cyclomatic-complexity
    severity: info
    message: 'This method has more branches than the profile allows.'
    languages: [java]
    metric:
      measure: cyclomatic-complexity
      max: 25

  # Excluded from test trees: a suite that asserts identity needs distinct boxed
  # instances, so `new Integer(4)` before an assertNotSame is correct there and
  # was every finding on guava before the exclusion.
  - id: maintainability.java.redundant-wrapper-instantiation
    severity: info
    message: 'This constructor allocates a wrapper where a literal or a valueOf call would do.'
    paths:
      exclude:
        - '**/test/**'
        - '**/tests/**'
        - '**/testing/**'
        - '**/*Test.java'
    ast:
      java: |
        ((object_creation_expression
           type: (type_identifier) @t
           arguments: (argument_list . (string_literal) .)) @report
         (#eq? @t "String"))
        ((object_creation_expression type: (type_identifier) @t) @report
         (#any-of? @t "Integer" "Long" "Short" "Byte" "Character" "Boolean" "Double" "Float"))

  - id: maintainability.java.boolean-literal-redundancy
    severity: info
    message: 'This expression restates a boolean value that is already the answer.'
    ast:
      java: |
        (binary_expression operator: ["==" "!="] right: [(true) (false)]) @report
        (binary_expression left: [(true) (false)] operator: ["==" "!="]) @report
        (ternary_expression
          consequence: [(true) (false)]
          alternative: [(true) (false)]) @report
