# The maintainability profile for python: one document per (profile, language)
# pair, loaded whole or not at all. See research/embedded-profiles/design.md
# section 1 for the packaging and the identity, and section 6 for the corpus
# and noise gates every rule here had to pass.
#
# Every rule is a concept-only citation. No pattern text, query text or
# message text is taken from any upstream project.
#
# parameter-count is deliberately absent. Measured over the 33-row noise set on
# #122 it reported 239 findings on boto v2.13.2, 2.8812 per kLOC against the
# 2.2 info ceiling of 1.0, and no path class carries the breach: 211 of the 239
# are under boto/ itself, 2.5436 per kLOC on their own. The findings are not
# wrong - boto/beanstalk/layer1.py's create_environment really does take ten
# parameters - they are what a keyword-argument-per-API-field SDK looks like,
# and raising the threshold high enough to accept boto would stop the rule
# saying anything on the other three repositories.
#
# star-import carries the one `paths` exclusion the #103 noise policy allows,
# set to `__init__.py`. The package initialiser that re-exports its submodules
# is the idiom behind the rule's findings and is not a finding a reviewer
# wants. With the exclusion the rule measures 0.1835 per kLOC on black and
# 0.0603 on boto against the 1.0 info ceiling.
#
# f-string-without-placeholder stays absent. It was re-examined under #103
# against the has-descendant predicates added under #114 and is not rescued by
# them. What the rule needs is the python pitfall list's P3, parent-kind
# exclusion: report a lone `(string)` with an f prefix and no brace, but not
# one that is a fragment of a `concatenated_string`, where the placeholders
# live in a sibling fragment and the leading fragment is correct. Both new
# predicates search the captured node's own subtree and neither reaches an
# ancestor, so the exclusion cannot be written as a negated sub-pattern and
# the rule still reports the dominant idiom.
version: 1
rules:
  - id: maintainability.python.function-length
    severity: info
    message: "this function is longer than the profile allows"
    languages: [python]
    metric:
      measure: function-length
      max: 120
  - id: maintainability.python.nesting-depth
    severity: info
    message: "this function nests deeper than the profile allows"
    languages: [python]
    metric:
      measure: nesting-depth
      max: 5
  - id: maintainability.python.cyclomatic-complexity
    severity: info
    message: "this function has more decision points than the profile allows"
    languages: [python]
    metric:
      measure: cyclomatic-complexity
      max: 25
  - id: maintainability.python.lambda-assignment
    severity: info
    message: "a lambda bound to a name is still anonymous in every traceback and repr"
    ast:
      python: "(assignment left: (identifier) right: (lambda) @report)"
  - id: maintainability.python.star-import
    severity: info
    message: "a wildcard import makes this module's namespace depend on another module's contents"
    paths:
      exclude:
        - "**/__init__.py"
    ast:
      python: "(import_from_statement (wildcard_import) @report)"
