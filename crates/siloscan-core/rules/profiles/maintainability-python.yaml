# The maintainability profile for python: one document per (profile, language)
# pair, loaded whole or not at all. See research/embedded-profiles/design.md
# section 1 for the packaging and the identity, and section 6 for the corpus
# and noise gates every rule here had to pass.
#
# Every rule is a concept-only citation. No pattern text, query text or
# message text is taken from any upstream project.
#
# parameter-count is deliberately absent. Measured over the 33-row noise set on
# #122 it reported 239 findings on boto v2.13.2, 2.8812 per kLOC against the
# 2.2 info ceiling of 1.0, and no path class carries the breach: 211 of the 239
# are under boto/ itself, 2.5436 per kLOC on their own. The findings are not
# wrong - boto/beanstalk/layer1.py's create_environment really does take ten
# parameters - they are what a keyword-argument-per-API-field SDK looks like,
# and raising the threshold high enough to accept boto would stop the rule
# saying anything on the other three repositories.
version: 1
rules:
  - id: maintainability.python.function-length
    severity: info
    message: "this function is longer than the profile allows"
    languages: [python]
    metric:
      measure: function-length
      max: 120
  - id: maintainability.python.nesting-depth
    severity: info
    message: "this function nests deeper than the profile allows"
    languages: [python]
    metric:
      measure: nesting-depth
      max: 5
  - id: maintainability.python.cyclomatic-complexity
    severity: info
    message: "this function has more decision points than the profile allows"
    languages: [python]
    metric:
      measure: cyclomatic-complexity
      max: 25
