# Ruby reliability profile. Original work: every query below was written
# against tree-sitter-ruby's own node-types.json. Rule names such as "rescue
# Exception" are not ownable and no pattern, query or message text is taken
# from another analyser.
#
# Identity: reliability-ruby@1. See crates/siloscan-core/src/profiles.rs.
#
# Three candidates from the rule matrix are deliberately absent, each removed
# on the measurement recorded in tests/profiles-corpus/noise/limits.tsv rather
# than re-tuned:
#   assignment-in-condition   1.4678 per kLOC on puma and 0.6972 on rails,
#                             over the gate. Every finding is the idiomatic
#                             `if w = @workers.find { ... }` truthy-assign.
#   self-comparison           both findings on rails are deliberate
#                             reflexivity assertions over an overloaded `==`
#                             - `assert zone1 == zone1` - where the result is
#                             not constant, the same shape that removed the
#                             cpp rule of this name.
#   unreachable-after-return  the one finding on rails is a `rescue` clause
#                             after a return, which is reached exactly when
#                             the body raises.
#
# rescue-exception and rescue-modifier carry `info` rather than `warning` since
# #122. Both measure 0.8468 per kLOC on puma over the 33-row noise set, over
# the 2.2 `warning` ceiling of 0.25 and under the `info` ceiling of 1.0. The
# findings are not wrong - a bare `rescue Exception` and a `rescue` modifier
# are what the queries say they are - but at that rate they are an observation
# about how the repository handles errors, not a defect report, and `info` is
# the severity that says so. Downgrading is not tuning: the queries and the
# thresholds are unchanged and the measured rows in
# tests/profiles-corpus/noise/limits.tsv still record what they always did.
#
# The #113 pitfall list carried sixteen further reliability candidates for
# #103. Six are absent, each dropped on the measurement against sinatra
# v3.2.0, puma v6.6.1 and rails v8.1.3.1 rather than re-tuned:
#   unsafe-deserialization    0.2530 per kLOC on rails, over the 2.2 `warning`
#                             ceiling of 0.25, and 0.1690 on sinatra. Four of
#                             the five inspected are the framework
#                             round-tripping payloads it wrote itself - the
#                             `Marshal.load(Marshal.dump(x))` deep copy, the
#                             cache entry, the Psych 3 config fallback - and
#                             the fifth, the XML `yaml` type parser, is real.
#   raise-exception           0.0242 per kLOC on rails. All nine findings are a
#                             test raising the broadest exception on purpose to
#                             prove the handler catches it.
#   inherit-exception         0.0215 per kLOC on rails. Seven of the eight
#                             findings are test scaffolding defining a class
#                             outside StandardError deliberately; the one in
#                             library code is Active Job's `Continuation`,
#                             whose own comment states the choice.
#   interpolation-in-single-quotes
#                             0.1690 per kLOC on sinatra and 0.0404 on rails.
#                             All three sinatra findings are a `:str` engine
#                             layout template whose `#{}` is interpolated
#                             later, and rails' are Ruby source lines a test
#                             writes into a config file.
#   safe-navigation-chain     0.0081 per kLOC on rails. All three findings end
#                             the chain in a method NilClass answers - `.to_s`,
#                             `.presence` - so no NoMethodError is reachable.
#   duplicate-method          0.0027 per kLOC on rails. The one finding is the
#                             alias-then-redefine idiom in `ERB::Util`, where
#                             the first definition is aliased before the second
#                             replaces it.
version: 1
rules:
  - id: reliability.ruby.rescue-exception
    severity: info
    message: 'Rescuing Exception catches SignalException and NoMemoryError too. Rescue StandardError instead.'
    ast:
      ruby: |
        ((rescue exceptions: (exceptions (constant) @report))
         (#eq? @report "Exception"))

  - id: reliability.ruby.rescue-modifier
    severity: info
    message: 'The rescue modifier swallows every StandardError with no way to see which one was raised.'
    ast:
      ruby: |
        (rescue_modifier) @report

  - id: reliability.ruby.self-assignment
    severity: warning
    message: 'This assignment writes a variable to itself and has no effect.'
    ast:
      ruby: |
        ((assignment
           left: (identifier) @l
           right: (identifier) @r) @report
         (#eq? @l @r))

  - id: reliability.ruby.identical-if-branches
    severity: warning
    message: 'Both branches of this if expression have the same single statement, so the condition decides nothing.'
    ast:
      ruby: |
        ((if
           consequence: (then . (_) @a .)
           alternative: (else . (_) @b .)) @report
         (#eq? @a @b))

  - id: reliability.ruby.ensure-return
    severity: warning
    message: 'A return inside ensure discards the exception that was on its way out.'
    ast:
      ruby: |
        (ensure (return) @report)

  - id: reliability.ruby.nested-method-definition
    severity: warning
    message: 'A def inside another def defines the inner method on the enclosing class the first time the outer method runs, so the method exists only once the outer one has been called.'
    ast:
      ruby: |
        (method body: (body_statement (method) @report))

  - id: reliability.ruby.duplicate-hash-key
    severity: warning
    message: 'This hash literal repeats a symbol key, so the earlier entry is dropped without a warning.'
    ast:
      ruby: |
        ((hash (pair key: (hash_key_symbol) @a) (pair key: (hash_key_symbol) @b)) @report (#eq? @a @b))

  - id: reliability.ruby.duplicate-case-condition
    severity: warning
    message: 'This case expression tests the same value twice, so the later branch is unreachable.'
    ast:
      ruby: |
        ((case (when pattern: (pattern) @a) (when pattern: (pattern) @b)) @report (#eq? @a @b))

  - id: reliability.ruby.shadowed-rescue
    severity: warning
    message: 'An earlier rescue StandardError clause already catches this class, so this clause is unreachable.'
    ast:
      ruby: |
        ((body_statement
           (rescue exceptions: (exceptions (constant) @first)) .
           (rescue exceptions: (exceptions (constant) @second)) @report)
         (#eq? @first "StandardError")
         (#not-any-of? @second "Exception" "SystemExit" "SignalException" "NoMemoryError"
                               "ScriptError" "LoadError" "NotImplementedError" "SyntaxError"
                               "SecurityError" "SystemStackError" "Interrupt"))

  - id: reliability.ruby.debugger-call
    severity: warning
    message: 'A debugger breakpoint left in committed code halts the process here and waits for a terminal that is not there.'
    ast:
      ruby: |
        ((call receiver: (identifier) @recv method: (identifier) @m) @report
         (#eq? @recv "binding")
         (#any-of? @m "pry" "irb" "break"))
        ((body_statement (identifier) @report) (#any-of? @report "debugger" "byebug"))
        ((block_body (identifier) @report) (#any-of? @report "debugger" "byebug"))
        ((then (identifier) @report) (#any-of? @report "debugger" "byebug"))
        ((program (identifier) @report) (#any-of? @report "debugger" "byebug"))

  - id: reliability.ruby.literal-condition
    severity: warning
    message: 'The condition is a literal, so this branch is always taken or never taken.'
    ast:
      ruby: |
        (if condition: [(true) (false) (integer) (float) (string) (simple_symbol)] @report)
        (unless condition: [(true) (false) (integer) (float) (string) (simple_symbol)] @report)

  - id: reliability.ruby.implicit-string-concatenation
    severity: warning
    message: 'Two adjacent string literals in an array become one element, which is usually a missing comma.'
    ast:
      ruby: |
        ((array (chained_string) @report) (#not-match? @report "\\n"))

  - id: reliability.ruby.deprecated-exists
    severity: warning
    message: 'File.exists? and Dir.exists? are deprecated aliases that warn on current Rubies; the current spelling is exist?.'
    ast:
      ruby: |
        ((call receiver: (constant) @recv method: (identifier) @m) @report
         (#any-of? @recv "File" "Dir")
         (#eq? @m "exists?"))

  - id: reliability.ruby.ineffective-access-modifier
    severity: warning
    message: 'A bare private does not apply to a singleton method, so this method is public.'
    ast:
      ruby: |
        ((body_statement (identifier) @mod . (singleton_method) @report) (#eq? @mod "private"))

  - id: reliability.ruby.empty-ensure
    severity: warning
    message: 'This ensure clause has no body, so it cleans up nothing.'
    ast:
      ruby: |
        ((ensure) @report (#match? @report "^ensure\\s*$"))
