# The reliability profile for typescript: one document per (profile, language)
# pair, loaded whole or not at all. See research/embedded-profiles/design.md
# section 1 for the packaging and the identity, and section 6 for the corpus
# and noise gates every rule here had to pass.
#
# Every rule is a concept-only citation. No pattern text, query text or
# message text is taken from any upstream project.
#
# There is no self-comparison rule here on purpose. `x === x` is the
# canonical NaN test in typescript exactly as it is in javascript,
# where the twin rule reported 215 of them on lodash and was dropped;
# zod, rxjs and nest simply happen not to write it, which is not a
# reason to ship a rule whose first real tree would breach it.
#
# `unreachable-after-return` is a 2.1 removal that returns under #103.
# The 2.1 query anchored the next sibling as a wildcard, so a hoisted
# `function` declaration after a return matched even though it is
# reachable; the shipped query anchors a positive alternation of
# non-hoisted statement types instead, and carries `@report` on that
# alternation so the finding lands on the dead statement rather than on
# the enclosing block. #117 held it back a second time because all 35
# findings on mantine were artefacts of `.tsx` being parsed with the
# non-JSX grammar. #124 fixed the grammar routing and the rule now
# measures 0.0000 per kLOC on zod, rxjs, nest and mantine alike.
#
# switch-case-fallthrough is one of the two "needs primitive" items of the
# typescript pitfall list (#108), rescued by the has-descendant predicates
# added under #114. The list asked for a terminal-child anchor with a negated
# type set; what landed is a subtree absence, so the shipped rule is the
# narrower question "this case runs statements and contains no break, return,
# throw or continue at all", with the descent stopped at nested function kinds
# so a return belonging to a callback does not count. It reports a subset of
# what the list described - a case that breaks only under an `if` is not
# reported - and every report is a case that falls through. A trailing anchor
# requires a following sibling, so the last case, which cannot fall through,
# is never reported, and a case with no statements, which is the deliberate
# grouped-fallthrough idiom, has no body child to match. It measures 0.0000
# per kLOC on zod, rxjs, nest and mantine; the same pattern with the negation
# inverted finds 61 correctly terminated cases on nest, so the zero is an
# absence of the bug and not a dead query.
#
# async-without-await is the other "needs primitive" item and is deliberately
# absent, dropped on the measurement recorded here rather than re-tuned:
#   async-without-await  4.0193 per kLOC on nest, 1.7960 on zod, 0.3042 on
#                        mantine, 0.0273 on rxjs, against the 0.25 warning
#                        ceiling. No path class carries the breach: dropping
#                        every test, sample and integration tree still leaves
#                        54 findings under nest's own packages/, 0.5095 per
#                        kLOC. All six read are the idiom the list predicted -
#                        an async member that exists to satisfy a
#                        Promise-returning interface whose other
#                        implementations do await: `async transform()` on the
#                        parse pipes, `async intercept()` on
#                        InterceptorsConsumer, `async apply()` on
#                        PipesConsumer, `public async init() {}` on the http
#                        adapter, `public async dispose() {}` on the ws
#                        adapter, `async wait()` returning a stored promise.
#                        TP:FP 0:6. The javascript twin ships, because
#                        javascript has no interface to conform to and the
#                        idiom does not appear there.
version: 1
rules:
  - id: reliability.typescript.self-assignment
    severity: warning
    message: "this assignment writes a variable to itself and has no effect"
    ast:
      typescript: "((assignment_expression left: (identifier) @l right: (identifier) @r) @report (#eq? @l @r))"
  - id: reliability.typescript.identical-if-branches
    severity: warning
    message: "both arms of this if have the same body, so the condition decides nothing"
    ast:
      typescript: "((if_statement consequence: (statement_block) @a alternative: (else_clause (statement_block) @b)) @report (#eq? @a @b))"
  - id: reliability.typescript.debugger-statement
    severity: warning
    message: "a debugger statement halts a browser session and is not meant to be committed"
    ast:
      typescript: "(debugger_statement) @report"
  - id: reliability.typescript.constant-condition
    severity: warning
    message: "this condition is a literal, so the branch is decided before the program runs"
    ast:
      typescript: "(if_statement condition: (parenthesized_expression [(true) (false)]) @report)"
  - id: reliability.typescript.throw-non-error-literal
    severity: warning
    message: "this throws a value that carries no stack trace, so every catch has to special-case it"
    ast:
      typescript: |
        ((throw_statement [(number) (object) (template_string)]) @report)
  - id: reliability.typescript.async-promise-executor
    severity: warning
    message: "an async promise executor swallows every rejection thrown inside it, so the promise never settles"
    ast:
      typescript: |
        ((new_expression
           constructor: (identifier) @c
           arguments: (arguments [(arrow_function "async") (function_expression "async")])) @report
         (#eq? @c "Promise"))
  - id: reliability.typescript.typeof-invalid-string
    severity: warning
    message: "typeof never returns this string, so the comparison is always false"
    ast:
      typescript: |
        ((binary_expression
           left: (unary_expression operator: "typeof")
           operator: ["===" "!==" "==" "!="]
           right: (string (string_fragment) @s)) @report
         (#not-any-of? @s "string" "number" "bigint" "boolean" "symbol" "undefined" "object" "function"))
  - id: reliability.typescript.nan-comparison
    severity: warning
    message: "nothing equals NaN, so this comparison is always false; use Number.isNaN"
    ast:
      typescript: |
        ((binary_expression operator: ["===" "!==" "==" "!="] right: (identifier) @r) @report
         (#eq? @r "NaN"))
        ((binary_expression left: (identifier) @l operator: ["===" "!==" "==" "!="]) @report
         (#eq? @l "NaN"))
  - id: reliability.typescript.unsafe-finally
    severity: warning
    message: "this jump out of a finally block discards whatever the try or catch was returning or throwing"
    ast:
      typescript: |
        ((finally_clause
           body: (statement_block
                   [(return_statement) (throw_statement) (break_statement) (continue_statement)])) @report)
  - id: reliability.typescript.assignment-in-condition
    severity: warning
    message: "this condition assigns rather than compares, which reads as a comparison at a glance"
    ast:
      typescript: |
        ((if_statement condition: (parenthesized_expression (assignment_expression))) @report)
        ((while_statement condition: (parenthesized_expression (assignment_expression))) @report)
  - id: reliability.typescript.extra-non-null-assertion
    severity: warning
    message: "the second non-null assertion asserts nothing the first did not"
    ast:
      typescript: |
        ((non_null_expression (non_null_expression)) @report)
  - id: reliability.typescript.non-null-after-optional-chain
    severity: warning
    message: "this asserts non-null on an optional chain, which defeats the check the chain was written to make"
    ast:
      typescript: |
        ((non_null_expression (member_expression optional_chain: (optional_chain))) @report)
        ((non_null_expression (subscript_expression optional_chain: (optional_chain))) @report)
  - id: reliability.typescript.duplicate-object-key
    severity: warning
    message: "this object literal sets the same key twice, so the earlier value is dead"
    ast:
      typescript: |
        ((object (pair key: (property_identifier) @a) (pair key: (property_identifier) @b)) @report
         (#eq? @a @b))
        ((object (pair key: (string (string_fragment) @a)) (pair key: (string (string_fragment) @b))) @report
         (#eq? @a @b))
  - id: reliability.typescript.switch-case-fallthrough
    severity: warning
    message: "this case runs statements and never breaks, returns, throws or continues, so control falls into the case below it"
    ast:
      typescript: |
        ((switch_body (switch_case body: (_)) @report . (_))
         (#not-has-descendant? @report "[(break_statement) (return_statement) (throw_statement) (continue_statement)] @t" "function_declaration function_expression arrow_function method_definition generator_function generator_function_declaration"))
  - id: reliability.typescript.unreachable-after-return
    severity: warning
    message: "this statement follows a return in the same block and can never run"
    ast:
      typescript: |
        (statement_block (return_statement) . [(expression_statement) (if_statement) (for_statement) (while_statement) (switch_statement) (try_statement) (return_statement) (throw_statement) (lexical_declaration) (variable_declaration)] @report)
