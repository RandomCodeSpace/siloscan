# C++ reliability profile. Original work: every query below was written
# against tree-sitter-cpp's own node-types.json. Rule names such as
# "assignment in condition" are not ownable and no pattern, query or message
# text is taken from another analyser.
#
# Identity: reliability-cpp@1. See crates/siloscan-core/src/profiles.rs.
#
# Four candidates from the rule matrix are deliberately absent, each removed on
# a measurement over the pinned noise set rather than re-tuned:
#   self-comparison           every finding read on nlohmann/json and abseil is
#                             a deliberate reflexivity assertion over an
#                             overloaded operator== - `CHECK(it1 == it1)`,
#                             `static_assert(t1 == t1, "")` - where the result
#                             is not constant and nothing is wrong.
#   unreachable-after-return  0.5093 per kLOC on nlohmann/json, and every
#                             finding read on all three repositories is a
#                             trailing comment on the return line, not code.
#   empty-catch               every finding read on fmt and abseil is the
#                             `try { f(); FAIL(); } catch (const E&) {}`
#                             assertion idiom or a fuzz entry point, not an
#                             error dropped by accident.
#   empty-if-body             the whole noise set yields two findings, both on
#                             abseil and both parse artifacts rather than a
#                             stray semicolon: in btree.h a `#endif` sits
#                             between an `if` and its body, which leaves an
#                             empty consequence node at the end of the `if`
#                             line, and in raw_hash_set.h a condition
#                             containing `Set::template EqualElement<...>`
#                             hits tree-sitter-cpp's `<`/`>` ambiguity and the
#                             report lands on the `;` of the next statement.
#                             Zero true positives on three repositories is not
#                             a threshold to tune.
#
# Three more candidates from the #111 pitfall list are absent for the same
# reason, measured on fmt 10.2.1, nlohmann/json v3.12.0 and abseil-cpp
# 20240722.2 under the 2.2 policy:
#   chained-relational-comparison  1.5267 per kLOC on abseil against a 0.25
#                             ceiling for a warning, and every finding read is
#                             a template-id tree-sitter-cpp resolves as
#                             arithmetic - `L::Partial(3).Pointer<0>(p)`,
#                             `atomic<CycleClockSourceFunc> f`. The breach is
#                             concentrated in template-dense headers, which are
#                             the library, so no `paths` exclusion reaches it.
#   bitwise-comparison-precedence  within the ceiling at 0.0657 per kLOC on
#                             nlohmann/json, and all eight findings read across
#                             nlohmann/json and abseil are parse artifacts: the
#                             match runs from a reference declarator in a macro
#                             argument (`json::invalid_iterator&);`) or from an
#                             `operator!=` declaration across the closing brace
#                             of the function above it. No finding is an
#                             expression whose operands group wrongly.
#   assignment-in-loop-condition  within the ceiling at 0.0118 per kLOC on
#                             abseil, and both findings are `} while (v /= 10);`
#                             in a digit-emitting loop. A compound assignment
#                             cannot be a mistyped comparison, which is the
#                             whole pitfall, so the yield here is zero.
#
# throw-escaping-destructor is one of the needs-primitive items the #111 list
# recorded, rescued by the has-descendant predicates #114 asked for and #127
# added. The list refused the text-predicate stand-in because `#match? @body
# "throw"` fires on the word in a comment or a string literal; the query below
# asks the tree instead, with `try_statement` stopping the descent so a throw
# the destructor catches itself does not count. Measured on 2026-09-05 at
# 0.0000 per kLOC on fmt, nlohmann/json and abseil-cpp - no finding on any of
# the three, which item 2's neighbours already established is what this class
# of mistake looks like in maintained C++.
#
# non-virtual-destructor-in-polymorphic-class was rescued by the same
# predicates, measured, and dropped. At 0.0683 per kLOC on fmt it is inside the
# 0.25 warning ceiling, but all six findings read across fmt and abseil-cpp are
# false positives, and both causes are outside what a query can see: a
# destructor is virtual when it carries `override` or when the base declares it
# virtual - gtest's `~DeathTestImpl() override`, `~ThreadLocal()` under a
# virtual base, abseil's `~CRCImpl() override = default` - and a protected
# non-virtual destructor is the correct spelling for a base nobody deletes
# polymorphically, which is `~scan_buffer() = default` in fmt and both abseil
# findings, one of which carries a `#pragma GCC diagnostic ignored
# "-Wnon-virtual-dtor"` saying so. Deciding either needs the access section a
# declaration sits in or the base class's own declaration, and neither is in
# reach of a subtree predicate.
version: 1
rules:
  - id: reliability.cpp.self-assignment
    severity: warning
    message: 'This assignment writes a variable to itself and has no effect.'
    ast:
      cpp: |
        ((assignment_expression
           left: (identifier) @l
           operator: "="
           right: (identifier) @r) @report
         (#eq? @l @r))

  - id: reliability.cpp.assignment-in-condition
    severity: warning
    message: 'This condition assigns rather than compares. Wrap it in a second pair of parentheses if that is deliberate.'
    ast:
      cpp: |
        (if_statement
          condition: (condition_clause
            value: (assignment_expression) @report))

  - id: reliability.cpp.identical-if-branches
    severity: warning
    message: 'Both branches of this if statement have the same body, so the condition decides nothing.'
    ast:
      cpp: |
        ((if_statement
           consequence: (compound_statement) @a
           alternative: (else_clause (compound_statement) @b)) @report
         (#eq? @a @b))

  - id: reliability.cpp.catch-by-value
    severity: warning
    message: 'This handler catches the exception by value, which copies it and slices a derived type down to its base.'
    ast:
      cpp: |
        (catch_clause
          parameters: (parameter_list
            (parameter_declaration
              type: [(type_identifier) (qualified_identifier) (template_type)]
              declarator: (identifier)) @report))

  - id: reliability.cpp.throw-pointer
    severity: warning
    message: 'This throws a pointer, so every handler has to catch the pointer type and delete it.'
    ast:
      cpp: |
        (throw_statement (new_expression)) @report

  - id: reliability.cpp.assert-with-side-effect
    severity: warning
    message: 'This assertion changes state, so the program behaves differently once NDEBUG removes it.'
    ast:
      cpp: |
        ((call_expression
           function: (identifier) @f
           arguments: (argument_list
             [(assignment_expression) (update_expression)])) @report
         (#eq? @f "assert"))

  - id: reliability.cpp.duplicate-else-if-condition
    severity: warning
    message: 'This else-if repeats the condition above it, so its branch can never run.'
    ast:
      cpp: |
        ((if_statement
           condition: (condition_clause value: (_) @c1)
           alternative: (else_clause
             (if_statement
               condition: (condition_clause value: (_) @c2)))) @report
         (#eq? @c1 @c2))

  - id: reliability.cpp.identical-logical-operands
    severity: warning
    message: 'Both operands of this logical operator are the same identifier, so one of them is the wrong variable.'
    ast:
      cpp: |
        ((binary_expression
           left: (identifier) @l
           operator: ["&&" "||"]
           right: (identifier) @r) @report
         (#eq? @l @r))

  - id: reliability.cpp.unsafe-c-string-call
    severity: warning
    message: 'This function writes without a destination bound and has a bounded replacement.'
    ast:
      cpp: |
        ((call_expression function: (identifier) @f) @report
         (#any-of? @f "strcpy" "strcat" "sprintf" "gets" "alloca" "strtok"))

  - id: reliability.cpp.size-comparison-always-true
    severity: warning
    message: 'An unsigned size is never below zero, so this comparison is always true.'
    ast:
      cpp: |
        ((binary_expression
           left: (call_expression
             function: (field_expression field: (field_identifier) @m))
           operator: ">="
           right: (number_literal) @z) @report
         (#eq? @m "size")
         (#eq? @z "0"))

  - id: reliability.cpp.throw-escaping-destructor
    severity: warning
    message: 'This destructor throws outside a try block, which terminates the process when it runs during stack unwinding.'
    ast:
      cpp: |
        ((function_definition
           declarator: (function_declarator
             declarator: [(destructor_name) @report (qualified_identifier name: (destructor_name) @report)])
           body: (compound_statement) @body)
         (#has-descendant? @body "(throw_statement) @t" "try_statement"))
