# C++ maintainability profile. Original work: the four measures are the
# engine's own (crates/siloscan-core/src/engines/metric.rs), the thresholds are
# this repository's, and the header rule was written against tree-sitter-cpp's
# node-types.json from the C++ Core Guidelines' concept alone.
#
# Identity: maintainability-cpp@1. See crates/siloscan-core/src/profiles.rs.
#
# function-length is deliberately absent, unlike every other language's
# maintainability document. Namespace-opening macros - ABSL_NAMESPACE_BEGIN,
# NLOHMANN_JSON_NAMESPACE_BEGIN - make tree-sitter-cpp parse a whole namespace
# body as one function_definition, so 121 of 166 findings on abseil and 31 of
# 93 on nlohmann/json were reported on a `namespace` or `class` line. Raising
# the threshold cannot help: the mis-parsed unit is thousands of lines long
# whatever the limit. The other three measures are unaffected, because a
# pseudo-function that wide is still shallow and unbranched.
#
# named-unsafe-cast ships for `const_cast` alone. Measured with
# `reinterpret_cast` in the same `#any-of?` list it reported 2.6628 per kLOC on
# abseil-cpp against a 1.0 ceiling for an info rule, and every finding read is
# bit-level code doing what it is there to do: `reinterpret_cast<void*>(
# syscall(SYS_mmap, ...))`, `reinterpret_cast<FnPtr>(value)` in an atomic hook.
# Dropping the one name brought the rule to 0.3018 per kLOC on the same
# repository; that is the removal the #111 list predicted, not a tuned
# threshold.
#
# incomplete-special-members is one of the needs-primitive items the #111 list
# recorded, rescued by the has-descendant predicates #114 asked for and #127
# added: "declares a destructor" is a positive pattern, "and does not declare a
# copy constructor or a copy assignment" is the negation the query language
# has no operator for. The destructor sub-pattern requires a user-provided
# destructor - a declaration, or a definition with a body - so `~T() = default`
# and `~T() = delete` do not arm the rule, because a compiler-generated
# destructor makes the compiler-generated copies exactly as correct. The
# move-only idiom is excluded for free: `T(const T&) = delete` is a copy
# constructor declaration and the negated sub-pattern sees it.
#
# It carries the one `paths` exclusion the 2.2 policy allows. Measured on
# 2026-09-05 without it, fmt reports 1.0238 per kLOC against the 1.0 ceiling
# for an info rule, and 44 of the 45 findings are in test/, which on fmt is the
# vendored gtest and gmock amalgamation - one third-party file carrying the
# whole breach. Excluding test trees brings fmt to 0.0228 and leaves
# nlohmann/json at 0.0000 and abseil-cpp at 0.2012, all inside the ceiling. Ten
# of abseil's 34 were read: eight are real - scope guards whose destructor
# restores something a copy would restore twice (ErrnoSaver, ScopedSetEnv,
# SchedulingHelper, ScopedEnable, ComplexityGuard), a sink that flushes
# (FormatSinkImpl), and two null streams that call `_exit` - and two are
# abstract polymorphic interfaces that cannot be copied anyway
# (FlagStateInterface, ZoneInfoSource).
version: 1
rules:
  - id: maintainability.cpp.using-namespace-in-header
    severity: info
    message: 'A using-namespace directive in a header leaks into every translation unit that includes it.'
    paths:
      include:
        - '**/*.h'
        - '**/*.hpp'
        - '**/*.hh'
        - '**/*.hxx'
    ast:
      cpp: |
        (using_declaration "namespace" (identifier) @report)

  - id: maintainability.cpp.parameter-count
    severity: info
    message: 'This function takes more parameters than the profile allows.'
    languages: [cpp]
    metric:
      measure: parameter-count
      max: 7

  - id: maintainability.cpp.nesting-depth
    severity: info
    message: 'This function nests more deeply than the profile allows.'
    languages: [cpp]
    metric:
      measure: nesting-depth
      max: 5

  - id: maintainability.cpp.cyclomatic-complexity
    severity: info
    message: 'This function has more branches than the profile allows.'
    languages: [cpp]
    metric:
      measure: cyclomatic-complexity
      max: 25

  - id: maintainability.cpp.implicit-converting-constructor
    severity: info
    message: 'This single-argument constructor is not explicit, so the type becomes an implicit conversion target at every call site.'
    ast:
      cpp: |
        ((class_specifier
           name: (type_identifier) @cls
           body: (field_declaration_list
             (declaration
               .
               declarator: (function_declarator
                 declarator: (identifier) @ctor
                 parameters: (parameter_list . (parameter_declaration type: (_) @ptype) .))) @report))
         (#eq? @ctor @cls)
         (#not-eq? @ptype @cls)
         (#not-match? @ptype "initializer_list"))
        ((class_specifier
           name: (type_identifier) @cls
           body: (field_declaration_list
             (function_definition
               .
               declarator: (function_declarator
                 declarator: (identifier) @ctor
                 parameters: (parameter_list . (parameter_declaration type: (_) @ptype) .))) @report))
         (#eq? @ctor @cls)
         (#not-eq? @ptype @cls)
         (#not-match? @ptype "initializer_list"))
        ((struct_specifier
           name: (type_identifier) @cls
           body: (field_declaration_list
             (declaration
               .
               declarator: (function_declarator
                 declarator: (identifier) @ctor
                 parameters: (parameter_list . (parameter_declaration type: (_) @ptype) .))) @report))
         (#eq? @ctor @cls)
         (#not-eq? @ptype @cls)
         (#not-match? @ptype "initializer_list"))
        ((struct_specifier
           name: (type_identifier) @cls
           body: (field_declaration_list
             (function_definition
               .
               declarator: (function_declarator
                 declarator: (identifier) @ctor
                 parameters: (parameter_list . (parameter_declaration type: (_) @ptype) .))) @report))
         (#eq? @ctor @cls)
         (#not-eq? @ptype @cls)
         (#not-match? @ptype "initializer_list"))

  - id: maintainability.cpp.redundant-virtual-with-override
    severity: info
    message: 'The override specifier already implies virtual, so writing both is redundant.'
    ast:
      cpp: |
        ((field_declaration
           "virtual"
           declarator: (function_declarator (virtual_specifier) @v)) @report
         (#eq? @v "override"))

  - id: maintainability.cpp.named-unsafe-cast
    severity: info
    message: 'This cast discards a guarantee the type system was holding.'
    ast:
      cpp: |
        ((call_expression
           function: (template_function name: (identifier) @f)) @report
         (#eq? @f "const_cast"))

  - id: maintainability.cpp.container-size-zero-comparison
    severity: info
    message: 'This compares a count against zero to ask an emptiness question that empty() answers directly.'
    ast:
      cpp: |
        ((binary_expression
           left: (call_expression
             function: (field_expression field: (field_identifier) @m))
           operator: ["==" "!="]
           right: (number_literal) @z) @report
         (#any-of? @m "size" "length")
         (#eq? @z "0"))

  - id: maintainability.cpp.incomplete-special-members
    severity: info
    message: 'This class defines a destructor but neither declares nor deletes a copy constructor and a copy assignment operator.'
    paths:
      exclude:
        - '**/test/**'
        - '**/tests/**'
    ast:
      cpp: |
        ((class_specifier
           name: (type_identifier) @report
           body: (field_declaration_list) @body)
         (#has-descendant? @body "[(declaration declarator: (function_declarator declarator: (destructor_name))) (function_definition declarator: (function_declarator declarator: (destructor_name)) body: (compound_statement))] @d" "class_specifier struct_specifier union_specifier")
         (#not-has-descendant? @body "(function_declarator declarator: (identifier) parameters: (parameter_list (parameter_declaration declarator: [(reference_declarator) (abstract_reference_declarator)]))) @cc" "class_specifier struct_specifier union_specifier")
         (#not-has-descendant? @body "((operator_name) @o (#eq? @o \"operator=\"))" "class_specifier struct_specifier union_specifier"))
