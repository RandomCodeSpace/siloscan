[package]
name = "siloscan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Universal offline rule-based static code scanner"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
sha2 = "0.11.0"
siloscan-core = { path = "../siloscan-core", version = "2.0.0" }
siloscan-tui = { path = "../siloscan-tui", version = "2.0.0" }

# The saved report's state root and its atomic replacement are the only
# platform-specific code in this crate, so both bindings are target-only: a
# Linux or Windows build never sees Foundation, and nothing outside Windows
# links the Win32 crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSPathUtilities",
    "NSURL",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "siloscan"
path = "src/main.rs"

[[bin]]
name = "ss"
path = "src/bin/ss.rs"
