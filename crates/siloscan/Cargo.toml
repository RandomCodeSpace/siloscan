[package]
name = "siloscan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Universal offline rule-based static code scanner"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
siloscan-core = { path = "../siloscan-core", version = "1.0.2" }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "siloscan"
path = "src/main.rs"

[[bin]]
name = "ss"
path = "src/bin/ss.rs"
