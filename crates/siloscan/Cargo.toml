[package]
name = "siloscan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Universal offline rule-based static code scanner"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
siloscan-core = { path = "../siloscan-core", version = "1.4.0" }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "siloscan"
path = "src/main.rs"

[[bin]]
name = "ss"
path = "src/bin/ss.rs"
