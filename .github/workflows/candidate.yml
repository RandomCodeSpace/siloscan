name: Release candidate

# Pre-tag qualification. Runs the archive, package, install and identity gates
# against any branch or commit and creates no release state whatsoever: no tag,
# no release, no registry publication. Everything it produces is a workflow
# artifact bound to one full commit SHA.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full commit SHA to qualify.
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  identity:
    name: Resolve the candidate commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      # Every later job checks out this resolved SHA and asserts it, so a branch
      # that moves mid-run cannot split the candidate across two commits.
      - name: Resolve the requested ref to one full commit SHA
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "$sha is not a full 40-character SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "candidate $REQUESTED_REF resolves to $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Report whether the candidate is the current main tip
        env:
          CANDIDATE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$main" = "$CANDIDATE_SHA" ]; then
            echo "candidate is the current main tip" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "warning: main is at $main, candidate is $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

  qualify:
    name: Qualify
    needs: identity
    uses: ./.github/workflows/qualify.yml
    with:
      sha: ${{ needs.identity.outputs.sha }}

  # Still to be added to this workflow by their owning work packages, each
  # taking the same resolved candidate SHA:
  #
  #   automatic-journey  - package 6, the bare and review journeys per ecosystem
  #   persistence        - package 6, native Linux, macOS and Windows state paths
  #   tui-pty            - package 5, fixed-size live and snapshot PTY flows
  #   performance        - the 14 paired performance cells
  #
  # They are deliberately absent rather than stubbed: a job that passes without
  # running its lane would qualify a candidate that was never tested.
