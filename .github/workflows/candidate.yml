name: Release candidate

# Pre-tag qualification. Runs the archive, package, install and identity gates
# and creates no release state whatsoever: no tag, no release, no registry
# publication. Everything it produces is a workflow artifact bound to one full
# commit SHA.
#
# It qualifies the ref it was dispatched on, never a ref given as an input:
# `gh workflow run candidate.yml --ref <branch-or-sha>`. A workflow that
# checked out a caller-supplied ref would let untrusted code run against this
# repository's shared build cache.
on:
  workflow_dispatch:
    inputs:
      require_main_tip:
        description: Fail unless the dispatched commit is the current tip of main.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  identity:
    name: Resolve the candidate commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A candidate is only meaningful as one full commit SHA, and the plan's
      # identity chain starts at the current main tip. Dispatching with
      # require_main_tip off qualifies a branch and cannot feed a release.
      - name: Record the candidate commit
        env:
          REQUIRE_MAIN_TIP: ${{ inputs.require_main_tip }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "$GITHUB_SHA is not a full 40-character SHA" >&2
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "checked out $head, candidate is $GITHUB_SHA" >&2
            exit 1
          fi
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "candidate $GITHUB_REF_NAME is $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "candidate is the current main tip" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$REQUIRE_MAIN_TIP" = "true" ]; then
            echo "main is at $main, candidate is $GITHUB_SHA" >&2
            echo "dispatch with require_main_tip disabled to qualify a branch" >&2
            exit 1
          else
            echo "warning: main is at $main; this candidate cannot feed a release" >> "$GITHUB_STEP_SUMMARY"
          fi

  qualify:
    name: Qualify
    needs: identity
    uses: ./.github/workflows/qualify.yml

  # The plan's explicit compatibility gate. The harness builds the pinned
  # v1.5.1 reference out of this repository's own object store, so the checkout
  # needs full history, and it runs here as well as in ordinary CI so a
  # candidate run names it among its own gates.
  explicit-compatibility:
    name: Explicit compatibility
    needs: identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record the candidate identity
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "checked out $head, candidate is $GITHUB_SHA" >&2
            exit 1
          fi
          echo "explicit compatibility at $head" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Frozen oracle comparison and cross-version readers
        run: cargo test --locked -p siloscan --test v2_oracle_harness

  # The bare journey over every ecosystem fixture: the approved setup,
  # capability, report and review lines, the unchanged 220-rule pack, and clean
  # JSON and SARIF routing.
  automatic-journey:
    name: Automatic journey
    needs: identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the candidate identity
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "checked out $head, candidate is $GITHUB_SHA" >&2
            exit 1
          fi
          echo "automatic journey at $head" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Bare journey per ecosystem
        run: cargo test --locked -p siloscan --test v2_journey

  # The saved report on all three platforms, natively. The state root is a
  # different platform call on each of them and the atomic replacement is a
  # different system call, so this is the one lane that cannot be proved by
  # cross-building.
  persistence:
    name: Platform persistence (${{ matrix.os }})
    needs: identity
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the candidate identity
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "checked out $head, candidate is $GITHUB_SHA" >&2
            exit 1
          fi
          echo "persistence ${{ matrix.os }} at $head" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: State paths, publication and review
        run: cargo test --locked -p siloscan --test v2_persistence --test v2_cli

  # Every session a user can open, driven through a fixed 120x40
  # pseudo-terminal: both entry points, live and snapshot, the read-only
  # refusal, and terminal restore on each exit. Linux only, which is where the
  # plan puts this gate.
  tui-pty:
    name: TUI PTY sessions
    needs: identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record the candidate identity
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "checked out $head, candidate is $GITHUB_SHA" >&2
            exit 1
          fi
          echo "TUI PTY sessions at $head" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The driver's own parsing is unit-tested before it is trusted to judge a
      # session: a driver that read the screen wrongly would pass this lane
      # without proving anything.
      - name: Driver unit tests
        run: python3 -m unittest discover -s scripts -p 'test_tui_*.py'
      - name: Build the session binaries
        run: cargo build --locked -p siloscan -p siloscan-tui
      - name: Drive every session
        run: |
          set -euo pipefail
          python3 scripts/journey_tui_gate.py \
            --siloscan target/debug/siloscan \
            --ss target/debug/ss \
            --siloscan-tui target/debug/siloscan-tui \
            --oracle research/oracle-v1.5.1 \
            --work "$RUNNER_TEMP/tui-gate"

  # The 14 paired wall-time and peak-RSS cells. The lane is a reusable workflow
  # so it runs the same way here and from any later caller.
  performance:
    name: Performance
    needs: identity
    uses: ./.github/workflows/performance.yml
