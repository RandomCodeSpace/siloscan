name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default, as in ci.yml. Only the jobs that create the draft,
# attach assets to it, or make it public raise that to write, and the publish
# jobs get a registry token and nothing else.
#
# Every job is safe to repeat: "Re-run all jobs" overwrites its own artifacts,
# re-uploads assets with --clobber, and republishes nothing that the registry
# already holds. Re-running individual jobs is not supported, because the
# publish order is expressed as job dependencies.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    # Creates the release the other jobs attach assets to. It stays a draft
    # until publication, the registry install and asset re-verification succeed.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the tag matches the workspace version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "could not read version from [workspace.package] in Cargo.toml" >&2
            exit 1
          fi
          if [ "v$version" != "$REF_NAME" ]; then
            echo "tag $REF_NAME does not match workspace version $version (expected tag v$version)" >&2
            exit 1
          fi
          echo "tag $REF_NAME matches workspace version $version"
      # The identity chain starts here: the tag has to point at the exact
      # commit that is main's tip and that ordinary CI has already passed.
      - name: Verify the tag is the current tip of main
        run: |
          set -euo pipefail
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "tagged $GITHUB_SHA but main is at $main" >&2
            exit 1
          fi
          echo "release for $GITHUB_SHA as $GITHUB_REF_NAME, the current main tip" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ordinary CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.workflow_runs | length')"
          if [ "$runs" -lt 1 ]; then
            echo "no successful ci.yml run for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "ordinary CI passed for $GITHUB_SHA in $runs run(s)" >> "$GITHUB_STEP_SUMMARY"
      # Created as a draft, so no release is publicly visible before an archive
      # exists. A rerun reuses the existing draft rather than failing.
      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "release $REF_NAME is already public; refusing to rebuild its assets" >&2
              exit 1
            fi
            echo "reusing the existing draft $REF_NAME"
          else
            gh release create "$REF_NAME" --draft --verify-tag --title "$REF_NAME" --generate-notes
          fi

  # The same archive, package, install and identity gates a pre-tag candidate
  # runs, now bound to the tagged commit. It takes no ref: the called workflow
  # checks out this run's own GITHUB_SHA.
  qualify:
    name: Qualify
    needs: create-release
    uses: ./.github/workflows/qualify.yml

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-cyclonedx
        env:
          CYCLONEDX_VERSION: "0.5.9"
          CYCLONEDX_SHA256: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
        run: |
          set -euo pipefail
          asset="cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz"
          url="https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/$asset"
          curl --proto '=https' --tlsv1.2 -sSfL "$url" -o cyclonedx.tar.xz
          echo "$CYCLONEDX_SHA256  cyclonedx.tar.xz" | sha256sum -c -
          mkdir -p cyclonedx
          tar xJf cyclonedx.tar.xz -C cyclonedx --strip-components 1
          sudo install -m 0755 cyclonedx/cargo-cyclonedx /usr/local/bin/cargo-cyclonedx
          rm -rf cyclonedx.tar.xz cyclonedx
          cargo cyclonedx --version
      - name: Verify Cargo.lock is current
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --exit-code -- Cargo.lock
      - name: Generate CycloneDX SBOMs
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "sbom for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          cargo cyclonedx --all --format json --spec-version 1.5 --target all --override-filename bom
          mkdir -p sbom
          for crate in siloscan siloscan-tui; do
            src="crates/$crate/bom.json"
            if [ ! -s "$src" ]; then
              echo "cargo-cyclonedx produced no SBOM for $crate" >&2
              exit 1
            fi
            mv "$src" "sbom/$crate-$REF_NAME.cdx.json"
          done
          cd sbom
          sha256sum ./*.cdx.json > SHA256SUMS-sbom.txt
          cat SHA256SUMS-sbom.txt
      # The SBOMs join the identity chain like every other artifact.
      - name: Record the SBOM identity
        run: |
          set -euo pipefail
          sha256sum sbom/*.cdx.json | jq -Rn --arg sha "$GITHUB_SHA" \
            '{kind: "sbom", sha: $sha, files: [inputs | split("  ") | {name: (.[1] | sub("^sbom/"; "")), sha256: .[0]}]}' \
            > sbom/record-sbom.json
          cat sbom/record-sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom
          if-no-files-found: error
          overwrite: true

  attach:
    name: Attach assets to the draft
    runs-on: ubuntu-latest
    needs: [qualify, sbom]
    # Uploads the qualified archives, checksums and SBOMs to the draft release.
    permissions:
      contents: write
    steps:
      - name: Record the release identity
        run: echo "attaching assets built from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: assets
      # Only the qualified archives, their checksums and the SBOMs become
      # assets; the identity records stay workflow artifacts. --clobber keeps a
      # rerun of this job safe.
      - name: Upload the qualified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f assets/record-*.json
          ls -l assets
          gh release upload "$REF_NAME" --clobber assets/*

  publish-core:
    name: Publish siloscan-core
    runs-on: ubuntu-latest
    needs: [qualify, attach]
    # Publishes to crates.io with a registry token and touches the GitHub
    # release not at all.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Packaged here, after every crate this one depends on is registry-visible,
      # so the local bytes are the bytes cargo publish is about to upload.
      - name: Package the crate
        run: cargo package --locked -p siloscan-core
      # Publishes only if this exact version is absent, then polls the index
      # until a clean consumer can fetch it and verifies checksum and commit.
      - name: Publish and verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          set -euo pipefail
          echo "publishing siloscan-core $VERSION from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/registry_publish.py \
            --package siloscan-core \
            --version "$VERSION" \
            --crate-file "target/package/siloscan-core-$VERSION.crate" \
            --expected-sha "$GITHUB_SHA" \
            --record "$RUNNER_TEMP/records/record-publish-siloscan-core.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-siloscan-core
          path: ${{ runner.temp }}/records
          if-no-files-found: error
          overwrite: true

  publish-tui:
    name: Publish siloscan-tui
    runs-on: ubuntu-latest
    # siloscan-core must be registry-visible and verified before the TUI, which
    # depends on it, is published.
    needs: [qualify, attach, publish-core]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Packaged here, after every crate this one depends on is registry-visible,
      # so the local bytes are the bytes cargo publish is about to upload.
      - name: Package the crate
        run: cargo package --locked -p siloscan-tui
      - name: Publish and verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          set -euo pipefail
          echo "publishing siloscan-tui $VERSION from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/registry_publish.py \
            --package siloscan-tui \
            --version "$VERSION" \
            --crate-file "target/package/siloscan-tui-$VERSION.crate" \
            --expected-sha "$GITHUB_SHA" \
            --record "$RUNNER_TEMP/records/record-publish-siloscan-tui.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-siloscan-tui
          path: ${{ runner.temp }}/records
          if-no-files-found: error
          overwrite: true

  publish-cli:
    name: Publish siloscan
    runs-on: ubuntu-latest
    # Last, because the CLI is the crate a user installs and it may depend on
    # either of the two above.
    needs: [qualify, attach, publish-tui]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Packaged here, after every crate this one depends on is registry-visible,
      # so the local bytes are the bytes cargo publish is about to upload.
      - name: Package the crate
        run: cargo package --locked -p siloscan
      - name: Publish and verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          set -euo pipefail
          echo "publishing siloscan $VERSION from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/registry_publish.py \
            --package siloscan \
            --version "$VERSION" \
            --crate-file "target/package/siloscan-$VERSION.crate" \
            --expected-sha "$GITHUB_SHA" \
            --record "$RUNNER_TEMP/records/record-publish-siloscan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-siloscan
          path: ${{ runner.temp }}/records
          if-no-files-found: error
          overwrite: true

  install-verify:
    name: Install from crates.io
    runs-on: ubuntu-latest
    needs: [qualify, publish-cli]
    # Installs the published CLI as a user would. No release scope, no token.
    permissions:
      contents: read
    steps:
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          toolchain: stable
      # A fresh CARGO_HOME and an empty --root: nothing from this repository's
      # checkout, cache or target directory can satisfy this install.
      - name: Install the published CLI into fresh roots
        env:
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          set -euo pipefail
          echo "installing siloscan $VERSION from crates.io for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/install-root"
          CARGO_HOME="$RUNNER_TEMP/cargo-home" \
            cargo install --locked --version "$VERSION" --root "$RUNNER_TEMP/install-root" siloscan
          ls -l "$RUNNER_TEMP/install-root/bin"
      - name: One install provides both aliases
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/install-root/bin"
          test -x "$bin/siloscan"
          test -x "$bin/ss"
          "$bin/siloscan" --version
          "$bin/ss" --version
      # An explicit scope stays stateless: nothing may appear under the state
      # directory. The credential is generated at runtime so no credential-shaped
      # literal lives in this file.
      - name: Explicit scan writes no state
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/install-root/bin"
          scan="$RUNNER_TEMP/journey"
          state="$RUNNER_TEMP/state"
          rm -rf "$scan" "$state"
          mkdir -p "$scan" "$state"
          python3 -c "import secrets; print('API_TOKEN=' + secrets.token_hex(20))" > "$scan/config.env"
          set +e
          XDG_STATE_HOME="$state" "$bin/siloscan" "$scan" --format json > "$RUNNER_TEMP/out.json"
          status=$?
          set -e
          echo "exit status: $status"
          test "$status" -le 1
          python3 -c "import json,sys; assert json.load(open(sys.argv[1]))['findings']" "$RUNNER_TEMP/out.json"
          if [ -n "$(find "$state" -type f)" ]; then
            echo "an explicit scan wrote state:" >&2
            find "$state" -type f >&2
            exit 1
          fi
      # The bare save and review journeys only exist once #73 lands. Until then
      # the CLI has no `review` in its help and these steps report that they were
      # skipped; package 7's final pass removes the guard and makes them
      # unconditional.
      - name: Bare scan saves, review subcommand links
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/install-root/bin"
          scan="$RUNNER_TEMP/journey"
          state="$RUNNER_TEMP/state-bare"
          rm -rf "$state"
          mkdir -p "$state"
          if ! "$bin/siloscan" --help | grep -qw review; then
            echo "this build has no review subcommand yet; bare-save and review checks skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          (cd "$scan" && XDG_STATE_HOME="$state" "$bin/siloscan")
          status=$?
          set -e
          echo "exit status: $status"
          test "$status" -le 1
          if [ -z "$(find "$state" -type f)" ]; then
            echo "a bare scan saved no report under $state" >&2
            exit 1
          fi
          find "$state" -type f
          "$bin/siloscan" review --help
          "$bin/ss" review --help

  publicize:
    name: Verify assets and publish the release
    runs-on: ubuntu-latest
    needs: [qualify, publish-cli, install-verify]
    # The only job that makes the release public, and it does so only after the
    # registry install, the candidate binding and asset re-verification pass.
    # Draft assets are invisible to a read-scoped token, so this job reads them
    # with the same write scope it needs to publish.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      # Closes the identity chain: every artifact record produced anywhere in
      # this run, publication receipts included, has to name the release commit.
      - name: Verify every artifact names this commit
        run: python3 scripts/candidate_manifest.py check-records --records-dir artifacts --sha "$GITHUB_SHA"
      # A tag may only be released from a commit a pre-tag candidate qualified.
      - name: Find the candidate run that qualified this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/$GH_REPO/actions/workflows/candidate.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '[.workflow_runs[].id] | max // empty')"
          if [ -z "$run_id" ]; then
            echo "no successful candidate.yml run for $GITHUB_SHA: this commit was never qualified" >&2
            exit 1
          fi
          echo "qualified by candidate run $run_id" >> "$GITHUB_STEP_SUMMARY"
          rm -rf candidate-run
          gh run download "$run_id" --name candidate-manifest --dir candidate-run
      # Archive digests are not compared across runs: an archive records the
      # mtimes of freshly built binaries, so the same commit yields different
      # archive bytes. The packaged crates are reproducible and are compared
      # exactly.
      - name: Match this run against the qualified candidate
        run: |
          set -euo pipefail
          python3 scripts/candidate_manifest.py compare \
            --candidate candidate-run/candidate-manifest.json \
            --release artifacts/candidate-manifest/candidate-manifest.json
      - name: Re-download the draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf downloaded
          gh release download "$REF_NAME" --dir downloaded
          ls -l downloaded
      - name: Match the downloaded assets to the candidate manifest
        run: |
          set -euo pipefail
          python3 scripts/candidate_manifest.py verify-assets \
            --manifest artifacts/candidate-manifest/candidate-manifest.json \
            --assets-dir downloaded
      - name: Make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$REF_NAME" --draft=false
          echo "released $REF_NAME from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
